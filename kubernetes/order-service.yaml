apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: tcc-microservices-order-service:latest
          imagePullPolicy: Never
          env:
            - name: DATABASE_URL
              value: postgresql://tcc_user:tcc12345@postgres:5432/order_db
            - name: CUSTOMER_SERVICE_URL
              value: http://customer-service:8002
            - name: PRODUCT_SERVICE_URL
              value: http://product-service:8001
          ports:
            - containerPort: 8003
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  selector:
    app: order-service
  ports:
    - port: 8003
      targetPort: 8003