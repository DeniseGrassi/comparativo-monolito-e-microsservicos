apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer-service
  template:
    metadata:
      labels:
        app: customer-service
    spec:
      containers:
        - name: customer-service
          image: tcc-microservices-customer-service:latest
          imagePullPolicy: Never
          env:
            - name: DATABASE_URL
              value: postgresql://tcc_user:tcc12345@postgres:5432/customer_db
          ports:
            - containerPort: 8002
---
apiVersion: v1
kind: Service
metadata:
  name: customer-service
spec:
  selector:
    app: customer-service
  ports:
    - port: 8002
      targetPort: 8002